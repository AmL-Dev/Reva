[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "docvault"
version = "1.4.0"
description = "Internal document and report service"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "httpx>=0.27",
    "pydantic>=2.6",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
docvault-seed = "docvault.seed:main"

[tool.setuptools.packages.find]
include = ["docvault*"]

[tool.setuptools.package-data]
docvault = ["schema.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
